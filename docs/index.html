<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#f4f7fb">
    <title>推广工作台</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=20260917-6">
    <script type="module" src="./app.js?v=20260917-6"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div class="app-shell">
      <header class="app-header">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">推</div>
          <div>
            <p class="eyebrow">凉山运营数据</p>
            <h1>推广工作台</h1>
          </div>
        </div>

        <div class="sync-panel" aria-live="polite">
          <span id="sync-label">正在读取数据...</span>
          <span id="period-label"></span>
        </div>
      </header>

      <nav class="tabs desktop-tabs" role="tablist" aria-label="工作台功能">
        <button id="tab-teams" class="tab-button" type="button" role="tab" aria-selected="true" aria-controls="panel-teams" data-tab="teams">
          队伍
        </button>
        <button id="tab-drivers" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-drivers" data-tab="drivers" tabindex="-1">
          司机查询
        </button>
        <button id="tab-orders" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-orders" data-tab="orders" tabindex="-1">
          转单查询
        </button>
        <button id="tab-today" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-today" data-tab="today" tabindex="-1">
          今日推广
        </button>
      </nav>

      <main id="main-content" tabindex="-1">
        <div id="load-state" class="state-panel" role="status">
          <strong>正在载入数据</strong>
          <span>请稍候。</span>
        </div>

        <div id="app-content" hidden>
          <section id="panel-teams" class="tab-panel" role="tabpanel" aria-labelledby="tab-teams">
            <div class="section-intro">
              <div>
                <p class="section-kicker">本月累计</p>
                <h2>队伍司机</h2>
              </div>
              <p>选择队伍后查看每名司机的出车天数、真实转单、推广次数与推广差值（推广次数减出车天数）。</p>
            </div>

            <div id="team-options" class="team-grid" role="group" aria-label="选择队伍"></div>

            <div class="team-controls" aria-label="司机筛选与排序">
              <label>
                <span>完成状态</span>
                <select id="team-completion-filter">
                  <option value="all">全部司机</option>
                  <option value="completed">本月已完成</option>
                  <option value="unfinished">本月未完成</option>
                </select>
              </label>
              <label>
                <span>排序字段</span>
                <select id="team-sort-by">
                  <option value="realTransfers">真实转单</option>
                  <option value="outDays">出车天数</option>
                  <option value="promotionCount">推广次数</option>
                  <option value="promotionDelta">推广差值</option>
                </select>
              </label>
              <button id="team-sort-direction" class="sort-direction" type="button" aria-pressed="false">
                降序
              </button>
            </div>

            <div class="list-heading">
              <h3 id="team-title">一大队</h3>
              <div class="list-heading-meta">
                <span id="team-count" class="count-label"></span>
                <span id="team-updated" class="count-label"></span>
              </div>
            </div>
            <div id="team-drivers" class="driver-list"></div>
          </section>

          <section id="panel-drivers" class="tab-panel" role="tabpanel" aria-labelledby="tab-drivers" hidden>
            <div class="section-intro">
              <div>
                <p class="section-kicker">本月累计</p>
                <h2>司机数据查询</h2>
              </div>
              <p>输入姓名进行包含查询，输入纯数字工号进行精确查询，并查看本月推广完成状态。</p>
            </div>

            <form id="driver-search-form" class="search-form" role="search">
              <label for="driver-query">姓名或工号</label>
              <div class="search-row">
                <input id="driver-query" name="driver-query" type="search" autocomplete="off" enterkeyhint="search" placeholder="例：陈浩或11281385">
                <button class="primary-button" type="submit">查询</button>
              </div>
            </form>

            <p id="driver-search-status" class="result-status" aria-live="polite"></p>
            <div id="driver-results" class="driver-list"></div>
          </section>

          <section id="panel-orders" class="tab-panel" role="tabpanel" aria-labelledby="tab-orders" hidden>
            <div class="section-intro">
              <div>
                <p class="section-kicker">本月明细</p>
                <h2>推广转单查询</h2>
              </div>
              <p>按推荐司机工号查询全部转单及五个判定标记。</p>
            </div>

            <form id="order-search-form" class="search-form">
              <label for="order-query">推荐司机工号</label>
              <div class="search-row">
                <input id="order-query" name="order-query" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="search" placeholder="例：11281385">
                <button class="primary-button" type="submit">查询</button>
              </div>
            </form>

            <p id="order-search-status" class="result-status" aria-live="polite"></p>
            <div id="order-results"></div>
          </section>

          <section id="panel-today" class="tab-panel" role="tabpanel" aria-labelledby="tab-today" hidden>
            <div class="section-intro">
              <div>
                <p class="section-kicker">今日状态</p>
                <h2>今日推广数据查询</h2>
              </div>
              <p>仅显示本月真实转单不足 2 单的司机，今日已完成默认排在前面。</p>
            </div>

            <div id="today-team-options" class="team-grid" role="group" aria-label="选择今日队伍"></div>

            <div class="today-controls" aria-label="今日推广筛选与刷新">
              <button id="today-only-completed" class="secondary-button" type="button" aria-pressed="false">
                只看已推广
              </button>
              <button id="today-refresh" class="secondary-button" type="button">
                刷新
              </button>
            </div>

            <form id="today-search-form" class="search-form" role="search">
              <label for="today-query">姓名或工号</label>
              <div class="search-row">
                <input id="today-query" name="today-query" type="search" autocomplete="off" enterkeyhint="search" placeholder="查询司机今日推广状态">
                <button class="primary-button" type="submit">查询</button>
              </div>
            </form>

            <div class="today-meta">
              <span id="today-updated">正在读取今日数据...</span>
              <span id="today-refreshed"></span>
            </div>

            <div class="list-heading">
              <h3 id="today-team-title">一大队</h3>
              <span id="today-team-count" class="count-label"></span>
            </div>
            <p id="today-search-status" class="result-status" aria-live="polite"></p>
            <div id="today-drivers" class="driver-list"></div>
          </section>
        </div>
      </main>
    </div>

    <nav class="tabs mobile-tabs" role="tablist" aria-label="工作台功能">
      <button class="tab-button" type="button" role="tab" aria-selected="true" aria-controls="panel-teams" data-tab="teams">
        <span class="tab-icon" aria-hidden="true">队</span>
        <span>队伍</span>
      </button>
      <button class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-drivers" data-tab="drivers" tabindex="-1">
        <span class="tab-icon" aria-hidden="true">查</span>
        <span>司机查询</span>
      </button>
      <button class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-orders" data-tab="orders" tabindex="-1">
        <span class="tab-icon" aria-hidden="true">单</span>
        <span>转单查询</span>
      </button>
      <button class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-today" data-tab="today" tabindex="-1">
        <span class="tab-icon" aria-hidden="true">今</span>
        <span>今日推广</span>
      </button>
    </nav>
  </body>
</html>
